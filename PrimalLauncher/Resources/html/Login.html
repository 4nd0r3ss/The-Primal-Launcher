        body {

            background-color: #f9f9f9;
        }

        table {
            width: 100%;
            font-size: 1em;
            text-align: left;
        }

        img {
            border: none;
        }

        .container {
            height: 255px;
            display: inline-block;
            margin-top: 5px;
            width: 100%
        }

            margin-left: 15px;
            margin-top: 30px;
            display: inline-block;
            width: 360px;
            height: 200px;

            .logo-container img {

            font-size: 12px;

            border-radius: 5px;
            width: 350px;
            background-color: #f6f6f6;
            margin-left: 0;
            margin-bottom:10px;
            height: 210px;
            padding: 15px 5px;

            width: 71%;
            padding: 0;
            background: none;
            border: none;
            cursor: pointer;
        }

        .onetimepwd-link {
            color: brown;
            font-size: 0.8em;
            font-family: serif;
            text-decoration: underline;
        }

        .remember-id {
            font-size: 1em;
            font-family: serif;
        }

        #disclaimer {
            font-size: 0.6em;
            color: #aaa;
            position: absolute;
            bottom: 0;
        }

        input {
            border: 1px solid black;
            margin-top: 5px;
        }

        #onetimepwd {
            background-color: #ddd;
        }

        .center-banner {
            width: 100%;
            height: 100px;
            background-color: #ddd;
            margin: 10px 0 3px 0;
            text-align: center;
            cursor: pointer;
        }

        .banner-container {
            width: 100%;
            height: 70px;
            text-align: center;
        }

        .small-banner {
            width: 260px;
            height: 100%;
            background-color: #ddd;
        }
    </style>
